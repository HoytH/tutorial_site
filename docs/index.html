    // Restore URL after GitHub Pages 404 redirect
    (function () {
      var redirect = sessionStorage.getItem('ggg_redirect');
      if (redirect) {
        sessionStorage.removeItem('ggg_redirect');
        var url = new URL(redirect);
        if (url.pathname !== '/') {
          history.replaceState(null, '', url.pathname + url.search + url.hash);
        }
      }
    })();
  </script>
