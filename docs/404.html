<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Gentle Gator Golf Tutorials</title>
  <script>
    // GitHub Pages SPA redirect trick
    // Store the current URL in sessionStorage and redirect to root
    // so Angular's router can handle the navigation client-side.
    sessionStorage.setItem('ggg_redirect', location.href);
    location.replace('/');
  </script>
</head>

</html>
